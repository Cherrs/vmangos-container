name: Build, verify and publish to GHCR

on:
  push:
    branches: [main]
    paths: ['image/**', 'scripts/**', '.github/workflows/publish.yml']
  pull_request:
    paths: ['image/**', 'scripts/**', '.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vmangos-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      CI_IMAGE: vmangos-ci:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check startup scripts
        run: |
          python3 -m py_compile image/runtime.py
          bash -n scripts/smoke-test.sh
          shellcheck scripts/smoke-test.sh

      - name: Build image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./image
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.CI_IMAGE }}
          build-args: BUILD_JOBS=2
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.vmangos.core.source=https://github.com/vmangos/core
            io.vmangos.deployment.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify binaries, database import and login server
        run: bash scripts/smoke-test.sh "$CI_IMAGE"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$CI_IMAGE" "$image:sha-$GITHUB_SHA"
          docker tag "$CI_IMAGE" "$image:a9fa07a-5875"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:a9fa07a-5875"
          digest=$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r '.digest')
          test "${digest#sha256:}" != "$digest"
          echo "Published $image@$digest"
          {
            echo '### Published VMaNGOS image'
            echo
            echo "- Image: \`$image:sha-$GITHUB_SHA\`"
            echo "- Core/client tag: \`$image:a9fa07a-5875\`"
            echo "- Immutable reference: \`$image@$digest\`"
            echo '- Platform: linux/amd64; client: 1.12.1 build 5875'
            echo '- Passed: binary dependencies, MariaDB four-database import, repeat-bootstrap data preservation, realmd TCP startup'
            echo '- Not covered: extracted client maps or in-game login/world gameplay'
          } >> "$GITHUB_STEP_SUMMARY"
